# socclk_homeopathic.conf — Config UPP para stepping SOCCLK 972→1000 MHz
#
# Abordagem homeopática: SOCCLK escala gradual nos 8 níveis (0-7)
# Cada incremento é mínimo (4 MHz) para validação segura.
#
# Níveis SOCCLK:
#   0: 310 MHz (stock — idle)
#   1: 524 MHz (stock — low)
#   2: 567 MHz (stock — medium-low)
#   3: 619 MHz (stock — medium)
#   4: 680 MHz (stock — medium-high)
#   5: 756 MHz (stock — high)
#   6: 850 MHz (stock — very high)
#   7: 1000 MHz (overclock — max, stage final)
#
# Uso com UPP:
#   upp -p pp_table_stock.bin set --write --from-conf socclk_homeopathic.conf

# ============================================
# POWER LIMITS (350W)
# ============================================
SmallPowerLimit1=350
SmallPowerLimit2=350
BoostPowerLimit=350
SocketPowerLimitAc0=350
SocketPowerLimitAc0Tau=0
SocketPowerLimitDc=350
SocketPowerLimitDcTau=0

# ============================================
# TDC LIMITS
# ============================================
TdcLimitSoc=50
TdcLimitGfx=280
TdcLimitGfxTau=0

# ============================================
# TEMPERATURE LIMITS
# ============================================
TedgeLimit=100
ThotspotLimit=150
ThbmLimit=94

# ============================================
# SCLK OVERCLOCK (2000 MHz)
# ============================================
FreqTableGfx/8=2000
DcModeMaxFreq/0=2000
GfxclkDsMaxFreq=2000

# ============================================
# MCLK OVERCLOCK (1200 MHz)
# ============================================
FreqTableUclk/2=1200
FreqTableUclk/3=1200

# ============================================
# FCLK OVERCLOCK (1200 MHz)
# ============================================
FreqTableFclk/0=1200
FreqTableFclk/1=1200
FreqTableFclk/2=1200
FreqTableFclk/3=1200
FreqTableFclk/4=1200
FreqTableFclk/5=1200
FreqTableFclk/6=1200
FreqTableFclk/7=1200

# ============================================
# SOCCLK HOMEOPÁTICO — STEP BY STEP
# ============================================
# Cada stage modifica SOMENTE o nível 7 (máximo)
# Níveis 0-6 permanecem stock para estabilidade
#
# Stage 0:  FreqTableSocclk/7=972   (stock baseline)
# Stage 1:  FreqTableSocclk/7=976   (+4 MHz)
# Stage 2:  FreqTableSocclk/7=980   (+8 MHz)
# Stage 3:  FreqTableSocclk/7=984   (+12 MHz)
# Stage 4:  FreqTableSocclk/7=988   (+16 MHz)
# Stage 5:  FreqTableSocclk/7=992   (+20 MHz)
# Stage 6:  FreqTableSocclk/7=996   (+24 MHz)
# Stage 7:  FreqTableSocclk/7=1000  (+28 MHz) ← META
#
# Para gerar PP table de um stage específico,
# edite o valor de FreqTableSocclk/7 abaixo e rode:
#   upp -p pp_table_stock.bin set --write --from-conf socclk_homeopathic.conf -o pp_table_stage_N.bin

# SOCCLK Níveis 0-6 (STOCK — não modificar)
FreqTableSocclk/0=310
FreqTableSocclk/1=524
FreqTableSocclk/2=567
FreqTableSocclk/3=619
FreqTableSocclk/4=680
FreqTableSocclk/5=756
FreqTableSocclk/6=850

# SOCCLK Nível 7 (MODIFICAR por stage)
# Stage 0 (baseline): 972
# Stage 1: 976
# Stage 2: 980
# Stage 3: 984
# Stage 4: 988
# Stage 5: 992
# Stage 6: 996
# Stage 7 (META): 1000
FreqTableSocclk/7=1000

# ============================================
# VOLTAGE LIMITS (UNDERTVOLT GFX)
# ============================================
MinVoltageGfx=2650
MaxVoltageGfx=3890
